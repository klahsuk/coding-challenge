spring.application.name=coding-challenge
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.datasource.url=jdbc:h2:mem:transactions
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=transactions
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
processing.output-file=${PROCESSING_OUTPUT_FILE:output/transaction-results.csv}